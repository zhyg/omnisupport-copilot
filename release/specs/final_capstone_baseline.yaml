components:
  data:
    release_id: data-capstone-v1
    lakefs_repository: omnisupport-data
    lakefs_ref: refs/tags/data-capstone-v1
    iceberg_snapshot_ids:
      bronze.ticket_event: capstone-v1
      silver.ticket_current: capstone-v1
    source_paths:
      - assignments/final_capstone/yangong/reports/baseline_component_bindings.json
  index:
    release_id: index-capstone-v1
    data_release_id: data-capstone-v1
    embedding_model: deterministic-hash-embedding-v1@1536
    source_paths:
      - assignments/final_capstone/yangong/reports/baseline_component_bindings.json
  prompt:
    release_id: prompt-capstone-v1
    template_versions:
      answer: answer_v1
      no_answer: no_answer_v1
    source_paths:
      - services/rag_api/app/prompts/answer_v1.md
      - services/rag_api/app/prompts/no_answer_v1.md
  model:
    release_id: model-deterministic-fallback-v1
    provider: fallback
    model_id: deterministic-grounded-template-v1
    snapshot: git:1473db6dfa785487e1a0f87bb97bdfec6719725c
    system_card: assignments/final_capstone/yangong/reports/baseline_component_bindings.json
    models:
      generation: deterministic-grounded-template-v1
      embedding: deterministic-hash-embedding-v1
      rerank: disabled
    source_paths:
      - assignments/final_capstone/yangong/reports/baseline_component_bindings.json
  skills:
    release_id: skills-capstone-existing-v1
    packs:
      - add_internal_note@existing
      - grant_service_credit@existing
    source_paths:
      - contracts/tools/tool_contract_schema.json
      - contracts/tools/tools/ticket_update.json
  graph:
    release_id: graph-capstone-prechange-v1
    schema_version: graph_schema_v1
    source_paths:
      - assignments/final_capstone/yangong/reports/baseline_component_bindings.json
  service:
    release_id: service-capstone-v1
    components: [rag_api, tool_api, copilot_api, copilot_console]
    feature_flags:
      solution_card: false
    source_paths:
      - assignments/final_capstone/yangong/reports/baseline_component_bindings.json
quality:
  eval:
    run_id: e2e-baseline-legacy
    gate_status: pass
    report_path: assignments/final_capstone/yangong/reports/raw/e2e-baseline-legacy.json
    source_paths:
      - assignments/final_capstone/yangong/reports/raw/e2e-baseline-legacy.json
business_slo:
  policy_id: week12-slo-v1
  status: pass
  source_paths:
    - observability/slo/week12_slo.yaml
rollout:
  stages:
    - traffic_percent: 5
      min_samples: 1
      min_observation_minutes: 1
      gates: [{metric: legacy_e2e_pass, operator: ">=", threshold: 1}]
      baseline_guards: [{metric: unsafe_action_bypass_count, operator: "<=", threshold: 0}]
    - traffic_percent: 25
      min_samples: 1
      min_observation_minutes: 1
      gates: [{metric: legacy_e2e_pass, operator: ">=", threshold: 1}]
      baseline_guards: [{metric: unsafe_action_bypass_count, operator: "<=", threshold: 0}]
    - traffic_percent: 50
      min_samples: 1
      min_observation_minutes: 1
      gates: [{metric: legacy_e2e_pass, operator: ">=", threshold: 1}]
      baseline_guards: [{metric: unsafe_action_bypass_count, operator: "<=", threshold: 0}]
    - traffic_percent: 100
      min_samples: 1
      min_observation_minutes: 1
      gates: [{metric: legacy_e2e_pass, operator: ">=", threshold: 1}]
      baseline_guards: [{metric: unsafe_action_bypass_count, operator: "<=", threshold: 0}]
  red_lines:
    - {metric: unsafe_action_bypass_count, operator: ">", threshold: 0}
governance:
  change_ticket: CHG-FINAL-CAPSTONE-BASELINE
  data_classification: internal
  required_approvals: [release_owner, service_owner]
